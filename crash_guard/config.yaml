name: Crash Guard
version: "1.5.3"
slug: crash_guard
description: Catches and counts crashes - of Home Assistant and of every host program - checks the page cache for corrupted files and locks defective RAM blocks
url: https://github.com/n-schilling/ha-app-crash-guard
arch:
  - aarch64
  - amd64
startup: services
init: false
docker_api: true
hassio_api: true
hassio_role: manager
homeassistant_api: true
journald: true
services:
  - mqtt:want
map:
  - type: homeassistant_config
    read_only: true
options:
  drop_times:
    - "04:30"
    - "16:30"
  verify_on_drop: true
  drop_on_schedule: false
  check_interval: 10
  max_restarts_per_hour: 3
  notify_service: ""
  bad_pages: []
  ram_lock: false
  entity_prefix: crash_guard
  name_prefix: Crash Guard
  crash_window_hours: 24
  publish_evidence: false
  cases_to_keep: 20
  discovery_prefix: homeassistant
  log_level: info
schema:
  drop_times:
    - match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  verify_on_drop: bool
  drop_on_schedule: bool
  check_interval: int(5,300)
  max_restarts_per_hour: int(1,10)
  notify_service: match(^(notify\.[a-z0-9_]+)?$)?
  bad_pages:
    - match(^0x[0-9a-fA-F]+$)
  ram_lock: bool
  entity_prefix: match(^[a-z0-9_]+$)
  name_prefix: str
  crash_window_hours: int(1,168)
  publish_evidence: bool
  cases_to_keep: int(1,500)
  discovery_prefix: match(^[A-Za-z0-9_/-]+$)
  log_level: list(info|warning|error)
