# Broker for the CI tests, no persistence: anonymous on 1883; on 1884 only
# with the user name and password of tests/mosquitto.passwords (crash-guard,
# "pass with spaces"), to test the credentials in the options files
per_listener_settings true
persistence false
listener 1883
allow_anonymous true
listener 1884
allow_anonymous false
password_file /mosquitto/config/passwords
