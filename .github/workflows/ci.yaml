name: CI
# scripts/check.sh runs the same checks locally; keep the two in step.

# Not on main: a commit reaches main only after CI passed for it on dev, and
# the release workflow checks that before it tags (ci-passed.sh)
on:
  push:
    branches: [dev]
  pull_request:
  schedule:
    # Weekly, so a change of the base image, the linter or the broker shows up
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: App configuration
        uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2.21.2
        with:
          path: ./crash_guard
      - name: Changelog has the version
        run: .github/scripts/changelog-section.sh crash_guard/CHANGELOG.md "$(yq -r '.version' crash_guard/config.yaml)" > /dev/null
      - name: Shell scripts
        run: >-
          shellcheck --shell=bash --severity=warning --external-sources
          crash_guard/rootfs/etc/s6-overlay/s6-rc.d/guard/run
          crash_guard/rootfs/etc/s6-overlay/s6-rc.d/web/run
          crash_guard/rootfs/usr/local/bin/cg-hash.sh
          crash_guard/rootfs/usr/local/lib/crash-guard/lock.sh
          crash_guard/rootfs/usr/local/lib/crash-guard/entities.sh
          crash_guard/rootfs/usr/local/lib/crash-guard/rotate.sh
          crash_guard/rootfs/usr/local/lib/crash-guard/ref.sh
          crash_guard/rootfs/usr/local/lib/mqtt-device.sh
          tests/test_broker.sh tests/test_guard.sh tests/stubs/*
          tests/test_app.sh scripts/check.sh
          crash_guard/rootfs/usr/local/lib/crash-guard/schedule.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Python
        run: |
          pip install ruff==0.17.3
          ruff check crash_guard/rootfs/usr/local tests scripts

  test:
    name: Build and test (${{ matrix.arch }})
    # Each architecture on a runner of its own kind, no emulation: the image
    # is built and tested natively (the arm64 runners are free for public
    # repositories)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          version=$(yq -r '.version' crash_guard/config.yaml)
          docker build --build-arg "BUILD_VERSION=${version}" -t crash-guard:test crash_guard
      - name: Image architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          arch=$(docker image inspect --format '{{.Architecture}}' crash-guard:test)
          echo "image: ${arch}"
          [[ "${ARCH}/${arch}" == amd64/amd64 || "${ARCH}/${arch}" == aarch64/arm64 ]]
      - name: Test
        run: >-
          docker run --rm --network none
          -v "${PWD}/tests:/tests:ro" --entrypoint bash crash-guard:test
          /tests/test_app.sh
      - name: Test the guard service
        run: >-
          docker run --rm --network none --add-host supervisor:127.0.0.1
          -v "${PWD}/tests:/tests:ro" --entrypoint bash crash-guard:test
          /tests/test_guard.sh
      - name: Test the web page
        run: >-
          docker run --rm --network none
          -v "${PWD}/tests:/tests:ro" --entrypoint python3 crash-guard:test
          -m unittest discover -v -s /tests -p 'test_*.py'

  page:
    name: Page
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Build
        run: |
          version=$(yq -r '.version' crash_guard/config.yaml)
          docker build --build-arg "BUILD_VERSION=${version}" -t crash-guard:test crash_guard
      - name: Playwright
        run: |
          pip install playwright==1.65.0
          # The runner's Google Chrome, which the script prefers; Playwright's
          # Chromium (and its packages from apt) only where there is none
          if ! command -v google-chrome > /dev/null; then
            python -m playwright install --with-deps chromium
          fi
      # The built image with made-up data behind a stand-in for the ingress,
      # in throwaway containers; headless Chromium as Home Assistant shows it
      - name: Check the page
        run: python scripts/screenshots.py --check --image crash-guard:test

  broker:
    name: Against a real MQTT broker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          version=$(yq -r '.version' crash_guard/config.yaml)
          docker build --build-arg "BUILD_VERSION=${version}" \
            -t crash-guard:test crash_guard
      - name: Start the broker
        run: |
          docker network create ci
          docker run -d --name broker --network ci \
            -v "${PWD}/tests/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
            -v "${PWD}/tests/mosquitto.passwords:/mosquitto/config/passwords:ro" \
            eclipse-mosquitto:2.1.2-alpine@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
      - name: Test
        run: >-
          docker run --rm --network ci -v "${PWD}/tests:/tests:ro" --entrypoint bash
          crash-guard:test /tests/test_broker.sh
      - name: Broker log
        if: failure()
        run: docker logs broker

